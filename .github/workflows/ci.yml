name: Homecare checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check JavaScript
        run: node scripts/check-source.mjs
      - name: Test with synthetic data
        run: node --test --test-concurrency=2 tests/*.test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0
      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils fonts-noto-cjk
          python3 -m venv /tmp/homecare-qa-python
          /tmp/homecare-qa-python/bin/pip install pdfplumber==0.11.9 pypdf==6.10.0
      - name: All configured synthetic browser and restore regressions
        env:
          HOME_CARE_QA_PYTHON: /tmp/homecare-qa-python/bin/python3
          HOMECARE_COMPLETION_FINANCIAL_QA: outputs/software/financial-adjustments-qa
        run: pnpm test:regression --shard=${{ matrix.shard }}/6
      - name: Verify closed partial reconciliation evidence
        if: success() && matrix.shard == 6
        run: node scripts/check-claim-partial-evidence.mjs
      - name: Preserve synthetic regression results and visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homecare-synthetic-regression-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            outputs/software/regression/**/results.json
            outputs/software/visual-refresh-qa/**/*.png
            outputs/software/visual-refresh-qa/**/e2e.json
      - name: Preserve successful synthetic completion evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homecare-completion-evidence-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            outputs/software/completion-foundations-qa/**/RESULTS.json
            outputs/software/completion-foundations-qa/**/*.png
            outputs/software/financial-adjustments-qa/**/result.json
            outputs/software/financial-adjustments-qa/**/*.png
            outputs/software/settings-create-safety-qa/**/result.json
            outputs/software/settings-create-safety-qa/**/*.png
            outputs/software/claim-partial-reconciliation-qa/**/result.json
            outputs/software/claim-partial-reconciliation-qa/**/*.png
            outputs/software/employee-payroll-qa/**/result.json
            outputs/software/employee-payroll-qa/**/*.png
            outputs/software/custom-form-package-qa/**/browser-*.json
            outputs/software/custom-form-package-qa/**/*.png
            outputs/software/legacy-migrations-qa/attempt-*/browser.json
            outputs/software/legacy-migrations-qa/attempt-*/*.png
            outputs/software/legacy-history-qa/attempt-*/browser.json
            outputs/software/legacy-history-qa/attempt-*/*.png
