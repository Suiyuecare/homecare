name: Report diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        report: [employee-report, training-report, leave-report, certification-report]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0
      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils fonts-noto-cjk
          python3 -m venv /tmp/homecare-qa-python
          /tmp/homecare-qa-python/bin/pip install pdfplumber==0.11.9 pypdf==6.10.0
      - name: Direct synthetic report regression
        env:
          HOME_CARE_QA_PYTHON: /tmp/homecare-qa-python/bin/python3
        run: node tests/${{ matrix.report }}-e2e.mjs
      - name: Preserve failed synthetic PDF and text only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-${{ matrix.report }}-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            outputs/software/${{ matrix.report }}-qa/synthetic-${{ matrix.report }}.pdf
            outputs/software/${{ matrix.report }}-qa/pdf-expected.json
            outputs/software/${{ matrix.report }}-qa/pdf-text.txt
  portal-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exact synthetic Portal restore browser flow
        run: node tests/portal-synthetic-backup-e2e.mjs
      - name: Preserve only failure code locations and gate count
        if: failure()
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          data=json.loads(pathlib.Path('outputs/software/portal-synthetic-backup-qa/browser/e2e.json').read_text())
          failure=data.get('failure', {})
          points=[]
          for line in failure.get('locations', []):
              match=re.search(r'(tests/[a-z0-9/-]+\.mjs):(\d+):(\d+)',line)
              if match: points.append({'file':match[1],'line':int(match[2]),'column':int(match[3])})
          safe={'gateCount':len(data.get('checks', [])), 'name':failure.get('name') if failure.get('name') in ['AssertionError','TimeoutError','Error','TypeError'] else 'OTHER', 'code':failure.get('code') if failure.get('code') in ['ERR_ASSERTION','E2E_FAILURE'] else 'OTHER', 'sourcePoints':points}
          pathlib.Path('synthetic-portal-failure-points.json').write_text(json.dumps(safe,indent=2))
          print(json.dumps(safe))
          PY
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-portal-failure-points-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: synthetic-portal-failure-points.json
